[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
herdfs-client = { path = "crates/client" }
herdfs-core = { path = "crates/core" }
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
blake3 = "1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
fastcdc = "5"
fuser = { version = "0.18", default-features = false }
futures = "0.3"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
libc = "0.2"
nfsserve = { path = "vendor/nfsserve" }
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rustix = { version = "1", features = ["fs"] }
rusty-s3 = { version = "0.10", default-features = false, features = ["rustcrypto"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xattr = "1"

# The lab times the authority's SQL against contract C13; SQLite built at -O0 runs it 3x slower.
[profile.dev.package.libsqlite3-sys]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"
semicolon_if_nothing_returned = "warn"
