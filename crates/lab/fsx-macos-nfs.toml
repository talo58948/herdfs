# fsx 0.3.2 exits if these Linux/FreeBSD-only operations are selected on macOS.
flen = 4194304

[weights]
read = 150
write = 1
mapread = 30
mapwrite = 1
truncate = 3
fsync = 1
fdatasync = 1
close_open = 2
# fsx 0.3.2's MS_INVALIDATE gets EINVAL on plain APFS (Mac test day 4).
invalidate = 0
sendfile = 2
posix_fadvise = 0
copy_file_range = 0
posix_fallocate = 0
punch_hole = 0
