name: HerdFS
options:
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    ARCHS: arm64
    CODE_SIGNING_ALLOWED: NO
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_VERSION: "6.0"
targets:
  HerdFS:
    type: application
    platform: macOS
    sources:
      - Sources/Shared
      - Sources/App
    settings:
      base:
        ENABLE_APP_SANDBOX: NO
        # Static plists declare the URL scheme and Finder extension point that XcodeGen cannot infer.
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: dev.herdfs.HerdFS
        PRODUCT_NAME: HerdFS
    dependencies:
      - target: HerdFSFinder
        embed: true
    postBuildScripts:
      - name: Copy bundled CLI
        script: |
          mkdir -p "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          cp "${SRCROOT}/../../target/aarch64-apple-darwin/release/herdfs" \
            "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/herdfs"
          chmod 755 "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/herdfs"
        inputFiles:
          - $(SRCROOT)/../../target/aarch64-apple-darwin/release/herdfs
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/herdfs
  HerdFSFinder:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/Shared
        excludes:
          - CLI.swift
          - ControlClient.swift
          - MountRegistry.swift
      - Sources/Finder
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Sources/Finder/Finder.entitlements
        ENABLE_APP_SANDBOX: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/Finder/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: dev.herdfs.HerdFS.Finder
        PRODUCT_NAME: HerdFSFinder
        SKIP_INSTALL: YES
  HerdFSTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: HerdFS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.herdfs.HerdFS.Tests
schemes:
  HerdFS:
    build:
      targets:
        HerdFS: all
        HerdFSFinder: all
        HerdFSTests: [test]
    test:
      targets:
        - HerdFSTests
    archive:
      config: Release
