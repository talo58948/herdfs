name: HerdFS
options:
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    ARCHS: arm64
    CODE_SIGNING_ALLOWED: NO
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_VERSION: "5.0"
targets:
  HerdFS:
    type: application
    platform: macOS
    sources:
      - Sources/Shared
      - Sources/App
    info:
      path: Sources/App/Info.plist
    settings:
      base:
        ENABLE_APP_SANDBOX: NO
        PRODUCT_BUNDLE_IDENTIFIER: dev.herdfs.HerdFS
        PRODUCT_NAME: HerdFS
    dependencies:
      - target: HerdFSFinder
        embed: true
  HerdFSFinder:
    type: app-extension
    platform: macOS
    sources:
      - Sources/Shared
      - Sources/Finder
    info:
      path: Sources/Finder/Info.plist
    settings:
      base:
        ENABLE_APP_SANDBOX: NO
        PRODUCT_BUNDLE_IDENTIFIER: dev.herdfs.HerdFS.Finder
        PRODUCT_NAME: HerdFSFinder
        SKIP_INSTALL: YES
  HerdFSTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: HerdFS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.herdfs.HerdFS.Tests
schemes:
  HerdFS:
    build:
      targets:
        HerdFS: all
        HerdFSFinder: all
        HerdFSTests: [test]
    test:
      targets:
        - HerdFSTests
    archive:
      config: Release
