name: Linux

on:
  push:
    branches: [main, v0.1, 'v01-*', 'fix*', 'round*']
    paths:
      - crates/**
      - vendor/**
      - Cargo.*
      - .github/workflows/linux.yml
  pull_request:
    paths:
      - crates/**
      - vendor/**
      - Cargo.*
      - .github/workflows/linux.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: ~/go
          key: linux-go-${{ runner.arch }}-minio-RELEASE.2025-10-15T17-29-55Z
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: linux
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: nextest

      - name: Format
        run: cargo fmt --check -p herdfs-authority -p herdfs-agents
      - name: Clippy
        run: cargo clippy -p herdfs-authority -p herdfs-agents --all-targets -- -D warnings
      - name: Round 62 probes
        run: |
          cargo nextest run -p herdfs-authority --test round62_migration --no-fail-fast
          cargo nextest run -p herdfs-agents --test round62_output --no-fail-fast
