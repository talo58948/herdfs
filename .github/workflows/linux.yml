name: Linux

on:
  push:
    branches: [main, v0.1, 'v01-*', 'round*']
    paths:
      - crates/**
      - vendor/**
      - Cargo.*
      - .github/workflows/linux.yml
  pull_request:
    paths:
      - crates/**
      - vendor/**
      - Cargo.*
      - .github/workflows/linux.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: ~/go
          key: linux-go-${{ runner.arch }}-minio-RELEASE.2025-10-15T17-29-55Z
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: linux
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: nextest

      - name: Format
        run: |
          cargo fmt --check \
            -p herdfs-core -p herdfs-authority -p herdfs-client \
            -p herdfs-agents -p herdfs-lab
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Round 58 tests and controls
        run: |
          cargo nextest run -p herdfs-authority \
            --test round58_history --test round56_history --test local_tokens \
            --test migration --test acl --test auth --no-fail-fast
          cargo nextest run -p herdfs-agents \
            --test round58_cancel --test sessions --test session_files --no-fail-fast
