name: Linux

on:
  # Manual only: builds and tests run on the CI host (CI); this is a fallback.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: ~/go
          key: linux-go-${{ runner.arch }}-minio-RELEASE.2025-10-15T17-29-55Z
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: linux
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: nextest

      - name: Format
        run: |
          cargo fmt --check \
            -p herdfs-core -p herdfs-authority -p herdfs-client \
            -p herdfs-agents -p herdfs-lab
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Crate tests (sim 2000 seeds)
        env:
          SIM_SEEDS: 2000
        run: cargo nextest run -p herdfs-core -p herdfs-authority -p herdfs-client -p herdfs-agents

      - name: Install lab tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes fuse3 libfuse3-dev nfs-common
          go install github.com/minio/minio@RELEASE.2025-10-15T17-29-55Z
          curl --fail --location \
            https://github.com/Shopify/toxiproxy/releases/download/v2.12.0/toxiproxy-server-linux-amd64 \
            --output /tmp/toxiproxy-server
          echo '556d891134a3c582dc1e1a3f7335fd55142e5965769855a00b944e13e48302fc  /tmp/toxiproxy-server' \
            | sha256sum -c
          sudo install -m 0755 /tmp/toxiproxy-server /usr/local/bin/toxiproxy-server
          cargo install --locked fsx --version 0.3.2
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          sudo chmod a+rw /dev/fuse
          if ! grep --quiet '^user_allow_other$' /etc/fuse.conf; then
            echo user_allow_other | sudo tee --append /etc/fuse.conf
          fi
      - name: Build lab binaries
        run: cargo build --workspace --bins
      - name: Lab suites
        run: |
          loaded='test(kept_folder_survives_restart_follows_heads_and_becomes_evictable) |
            test(a_reader_sees_a_file_that_grows_whole) |
            test(a_rewrite_while_a_closed_write_commits_publishes_only_whole_versions) |
            test(f1_a_client_killed_before_its_commit_lands_commits_after_restart) |
            test(a_fork_takes_linear_time_and_leaves_its_parent_alone)'
          cargo nextest run -p herdfs-lab \
            --test smoke --test round_trip --test semantics --test faults \
            --test cli --test plans --test local_issuer --test control \
            -E "not ($loaded)" --no-fail-fast
          LAB_KEEP=1 cargo nextest run -p herdfs-lab \
            --test smoke --test round_trip --test semantics --test faults \
            --test cli --test plans --test local_issuer --test control \
            -E "$loaded" --test-threads=1 --no-fail-fast
      - name: Upload client logs on lab failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: client-logs
          path: /tmp/herdfs-lab-*/clients/*/client.log
          if-no-files-found: warn
      - name: Confirmed default-mount probes
        run: |
          cargo nextest run -p herdfs-lab --test redteam \
            -E 'test(round57) | test(round59_invalid_zip) | test(round59_paused_fsync)' \
            --no-fail-fast --no-tests=pass
      - name: fsx stream and chaos
        env:
          FSX_OPS: 20000
        run: cargo nextest run -p herdfs-lab --test fsx -E 'test(stream) | test(chaos)' --no-fail-fast
      - name: NFS suites
        env:
          LAB_MOUNT: nfs
        run: cargo nextest run -p herdfs-lab --test nfs --test round_trip --test control --no-fail-fast
      - name: Round 59 NFS probes
        env:
          LAB_MOUNT: nfs
        run: |
          cargo nextest run -p herdfs-lab --test redteam \
            -E 'test(round59_independent) | test(round59_remove) | test(round59_concurrent)' \
            --no-fail-fast --no-tests=pass
